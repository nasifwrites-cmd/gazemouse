name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Generate Dummy Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeMouse-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Workflow Summary Notice
        run: |
          echo "### 🚀 APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK artifact directly from the **Artifacts** section at the top of this run summary:" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`GazeMouse-Debug-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- Extract the zip and install on your Android device." >> $GITHUB_STEP_SUMMARY
